<div class="form-grup">

    </div>
    <div class="form-grup">

        </label>
        <label >

        </label>
        <label >

        </label>

      </div>
      <p class="baslık">İlgi Alanlarınız</p>

        <label for="ilgi">Teknoloji</label>

         <label for="ilgi">Seyahat</label>
        <input type="checkbox" name="Teknoloji" id="ilgi">
        <label for="ilgi">Spor</label>
        <input type="checkbox" name="Teknoloji" id="ilgi">
        <label for="ilgi">Kitap</label>
        <input type="checkbox" name="Teknoloji" id="ilgi">
        
      </div>

    </div>
   <button type="submit">Kayıt Ol</button>
   <p class="giris">Zaten hesabınız var mı? <a href="#">Giris Yap</a></p>
  </form>
</body>
</html>
